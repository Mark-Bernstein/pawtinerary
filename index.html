<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111b18" />
    <script>
      try {
        const savedTheme = localStorage.getItem("pawtinerary.theme.v1");
        const theme = savedTheme === "light" || savedTheme === "dog" ? savedTheme : "dark";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#f7f6f1" : theme === "dog" ? "#fff3d8" : "#111b18";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      html { background: #111b18; color-scheme: dark; }
      html[data-theme="light"] { background: #f7f6f1; color-scheme: light; }
      html[data-theme="dog"] { background: #fff3d8; color-scheme: light; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="A calmer way to plan dog walks and track earnings."
    />
    <title>Pawtinerary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
