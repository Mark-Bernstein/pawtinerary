<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff3d8" />
    <script>
      try {
        const savedTheme = localStorage.getItem("pawtinerary.theme.v1");
        const theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : "dog";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#f7f6f1" : theme === "dog" ? "#fff3d8" : "#111b18";
      } catch {
        document.documentElement.dataset.theme = "dog";
      }
    </script>
    <style>
      html { background: #fff3d8; color-scheme: light; }
      html[data-theme="light"] { background: #f7f6f1; color-scheme: light; }
      html[data-theme="dog"] { background: #fff3d8; color-scheme: light; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Plan dog walks, keep client details organized, and track visits in one calm workspace."
    />
    <link rel="canonical" href="https://pawtinerary.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pawtinerary" />
    <meta property="og:title" content="Pawtinerary | Dog Walking Planner" />
    <meta
      property="og:description"
      content="Plan dog walks, keep client details organized, and track visits in one calm workspace."
    />
    <meta property="og:url" content="https://pawtinerary.vercel.app/" />
    <meta
      property="og:image"
      content="https://pawtinerary.vercel.app/social-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1733" />
    <meta property="og:image:height" content="907" />
    <meta
      property="og:image:alt"
      content="Two dogs walking along a winding path beside a subtle calendar, in Pawtinerary's green and gold colors."
    />
    <meta name="twitter:card" content="summary_large_image" />

      rel="stylesheet"
    />
